name: Site checks

# Builds the Jekyll site and lints the generated HTML on every push / PR.
# - html-proofer: broken internal links, missing images, bad references (blocking)
# - w3c_validators: W3C HTML validation via tools/w3c_validate.rb (informational)

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  site-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true # bundle install + cache gems

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Lint HTML (html-proofer)
        run: |
          bundle exec htmlproofer ./_site \
            --disable-external \
            --allow-hash-href

      - name: Validate HTML (W3C)
        run: bundle exec ruby tools/w3c_validate.rb _site/index.html _site/404.html
        continue-on-error: true # W3C public API is rate-limited; report only

  # Builds with the SAME toolchain as live classic GitHub Pages (github-pages gem
  # = LibSass). Catches Dart-only Sass features (e.g. @use) that build fine locally
  # under jekyll 4.x but silently drop the stylesheet on classic Pages.
  classic-pages-build:
    runs-on: ubuntu-latest

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/pages/Gemfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false # no lockfile committed for the pages Gemfile

      - name: Install gems
        run: bundle install --jobs 4 --retry 3

      - name: Build site (classic Pages / LibSass)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Assert theme styles survived the build
        run: |
          grep -q -- '--accent' _site/assets/css/style.css && grep -q -- '.theme-toggle' _site/assets/css/style.css || { echo 'ERROR: built CSS is missing theme styles — the classic-Pages (LibSass) build silently dropped the stylesheet (Dart-only Sass feature like @use?).'; exit 1; }
